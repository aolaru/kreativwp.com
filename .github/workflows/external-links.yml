name: External destination diagnostics
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/content/**'
      - 'src/pages/**'
      - 'scripts/check-external-links.mjs'
jobs:
  destinations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:external
